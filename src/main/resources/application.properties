spring.application.name=board

server.port=8081

spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# File upload (board attachments)
file.upload-dir=./uploads/board
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# JWT (secret is in application-local.properties)
jwt.access-token-validity-seconds=1800
jwt.refresh-token-validity-seconds=1209600

# Admin bootstrap: signing up (email/password or OAuth2) with this email automatically grants ADMIN.
# Set the actual value in application-local.properties (per-environment, not committed).
admin.bootstrap-email=

# Board list cache (Redis, cache-aside). Disable to compare performance without caching (e.g. JMeter runs).
cache.board-list.enabled=true
cache.board-list.ttl-seconds=30

# Swagger (springdoc-openapi). Only document /api/** (excludes static-page routing like MainController's /login).
springdoc.paths-to-match=/api/**

# SMS notification (Twilio). Disabled by default so the app/tests run fine without real keys.
# Set the actual account-sid/auth-token/from-number in application-local.properties (per-environment, not committed).
sms.enabled=false
sms.twilio.account-sid=
sms.twilio.auth-token=
sms.twilio.from-number=

# After successful OAuth2 login, include the token and redirect to the frontend URL
oauth2.redirect-uri=http://localhost:8081/auth/oauth2-redirect.html

# Naver is not a provider provided by Spring Security by default, so register it manually (client-id/secret are in application-local.properties)
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

