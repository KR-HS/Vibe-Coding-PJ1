<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 - 게시판</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <a class="logo" href="/">게시판</a>
        <nav class="nav-links" id="nav-links"></nav>
    </header>

    <main class="board-main">
        <h1>회원 관리</h1>

        <p class="error-message" id="error-message"></p>

        <form id="search-form" class="search-form">
            <input type="text" id="keyword-input" name="keyword" placeholder="이메일/이름 검색">
            <button type="submit" class="btn btn-secondary search-btn">검색</button>
        </form>

        <table class="board-table">
            <thead>
                <tr>
                    <th class="col-author">이메일</th>
                    <th class="col-author">이름</th>
                    <th class="col-category">가입경로</th>
                    <th class="col-category">권한</th>
                    <th class="col-date">가입일</th>
                    <th class="col-author">관리</th>
                </tr>
            </thead>
            <tbody id="user-list-body"></tbody>
        </table>
        <p class="empty-message" id="empty-message" hidden>회원이 없습니다.</p>

        <div class="pagination" id="pagination"></div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/board/common.js"></script>
    <script src="/js/admin/users.js"></script>
</body>
</html>
