<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정 - 게시판</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <a class="logo" href="/">게시판</a>
        <nav class="nav-links" id="nav-links"></nav>
    </header>

    <main class="board-form-main">
        <div class="card board-form-card">
            <h1>게시글 수정</h1>
            <form id="edit-form">
                <div class="field">
                    <label for="category">카테고리</label>
                    <select id="category" name="category" required>
                        <option value="FREE">자유</option>
                        <option value="NOTICE">공지</option>
                        <option value="QNA">질문</option>
                    </select>
                </div>
                <div class="field">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title" maxlength="200" required>
                </div>
                <div class="field">
                    <label for="content">내용</label>
                    <textarea id="content" name="content" rows="12" required></textarea>
                </div>
                <div class="form-actions">
                    <a class="btn btn-secondary" id="cancel-link" href="/board/list.html">취소</a>
                    <button type="submit">수정 완료</button>
                </div>
                <p class="error-message" id="error-message"></p>
            </form>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/board/common.js"></script>
    <script src="/js/board/edit.js"></script>
</body>
</html>
