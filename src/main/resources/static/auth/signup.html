<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 게시판</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <a class="logo" href="/">게시판</a>
    </header>

    <main>
        <div class="card">
            <h1>회원가입</h1>
            <form id="signup-form">
                <div class="field">
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" required autocomplete="name">
                </div>
                <div class="field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password">
                </div>
                <button type="submit">회원가입</button>
                <p class="error-message" id="error-message"></p>
            </form>

            <p class="footer-link">이미 계정이 있으신가요? <a href="/auth/login.html">로그인</a></p>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/auth/signup.js"></script>
</body>
</html>
