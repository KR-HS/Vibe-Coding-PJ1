<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 게시판</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <a class="logo" href="/">게시판</a>
    </header>

    <main>
        <div class="card">
            <h1>로그인</h1>
            <form id="login-form">
                <div class="field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit">로그인</button>
                <p class="error-message" id="error-message"></p>
            </form>

            <div class="divider">또는</div>
            <div class="oauth-buttons">
                <a class="btn btn-secondary" href="/oauth2/authorization/google">Google로 로그인</a>
                <a class="btn btn-secondary" href="/oauth2/authorization/naver">Naver로 로그인</a>
            </div>

            <p class="footer-link">계정이 없으신가요? <a href="/auth/signup.html">회원가입</a></p>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/auth/login.js"></script>
</body>
</html>
